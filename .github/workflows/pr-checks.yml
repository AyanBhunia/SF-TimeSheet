name: PR Checks

on:
  pull_request:
    branches:
      - appexchange

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scope-guard:
    name: scope-guard (G1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b62b6d0ad9b0af0fb3b1e40be53ce9b9 # v4.2.0
        with:
          node-version: 22

      - name: Run scope-guard unit tests
        run: node --test ci/__tests__/scope-guard.test.js

      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr_body.txt

      - name: Run scope guard
        env:
          PR_BODY_FILE: pr_body.txt
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node ci/scope-guard.js

  static:
    name: static (G2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b62b6d0ad9b0af0fb3b1e40be53ce9b9 # v4.2.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npx eslint Timesheet/main/default/lwc Timesheet/main/default/aura

      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Check XML well-formedness
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash ci/check-xml.sh

  jest:
    name: jest (G3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b62b6d0ad9b0af0fb3b1e40be53ce9b9 # v4.2.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Jest tests
        run: npx sfdx-lwc-jest --coverage --passWithNoTests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
          if-no-files-found: ignore
