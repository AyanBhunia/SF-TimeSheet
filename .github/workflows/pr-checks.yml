name: PR Checks

on:
  pull_request:
    branches:
      - appexchange

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scope-guard:
    name: scope-guard (G1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Run scope-guard unit tests
        run: node --test ci/__tests__/scope-guard.test.js

      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr_body.txt

      - name: Run scope guard
        env:
          PR_BODY_FILE: pr_body.txt
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node ci/scope-guard.js

  static:
    name: static (G2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint on changed LWC and Aura files
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=d "$BASE_REF...HEAD" -- 'Timesheet/main/default/lwc/**/*.js' 'Timesheet/main/default/aura/**/*.js')
          if [ ${#files[@]} -eq 0 ]; then echo "No changed LWC or Aura files."; exit 0; fi
          npx eslint "${files[@]}"

      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Check XML well-formedness
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash ci/check-xml.sh

  jest:
    name: jest (G3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Jest tests
        run: npx sfdx-lwc-jest --coverage -- --passWithNoTests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  apex:
    name: apex (G4)
    # Secrets never reach fork PRs (docs/testing-pipeline.md section 6).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ci
    timeout-minutes: 60
    concurrency:
      group: ci-org
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@2.112.6

      - name: Authenticate to the CI org
        env:
          SF_CI_ORG_AUTH_URL: ${{ secrets.SF_CI_ORG_AUTH_URL }}
        run: |
          printf '%s' "$SF_CI_ORG_AUTH_URL" > "$RUNNER_TEMP/ci-org.url"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/ci-org.url" --alias ci-org > /dev/null
          rm -f "$RUNNER_TEMP/ci-org.url"

      - name: Dry-run deploy with local Apex tests
        run: |
          mkdir -p apex-results
          sf project deploy start --source-dir Timesheet --target-org ci-org \
            --dry-run --test-level RunLocalTests --coverage-formatters json-summary \
            --results-dir apex-results --junit --wait 60

      - name: Upload Apex results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: apex-results
          path: apex-results
          retention-days: 7
          if-no-files-found: ignore
