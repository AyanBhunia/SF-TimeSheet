<template>
    <div class="slds-m-around_x-small">
        <!-- Demo data prompt for HR admins without an active employee record -->
        <template if:true={showDemoBanner}>
            <div class="slds-scoped-notification slds-media slds-media_center slds-theme_info slds-m-bottom_small" role="status">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:info" alternative-text="Info" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p>{demoBannerMessage}</p>
                </div>
                <div class="slds-media__figure slds-media__figure_reverse">
                    <lightning-button label={demoBannerLabel} variant="brand" onclick={handleOpenDemoDataSetup}></lightning-button>
                </div>
            </div>
        </template>
        <div class="slds-grid slds-gutters">
            <template if:true={column1Data}>
                <div class="slds-col">
                    <template for:each={column1Data} for:item="field">
                        <div key={field.label} class="field-row">
                            <span class="field-label">
                                {field.label}:
                                <template if:true={field.helpText}>
                                    <lightning-helptext content={field.helpText} class="slds-m-left_xx-small"></lightning-helptext>
                                </template>
                            </span>
                            <span class="field-value">{field.value}</span>
                        </div>
                    </template>
                </div>

                <!-- Divider after Column 1 (if Column 2 exists) -->
                <template if:true={column2Data}>
                    <div class="vertical-divider"></div>
                </template>
            </template>

            <template if:true={column2Data}>
                <div class="slds-col">
                    <template for:each={column2Data} for:item="field">
                        <div key={field.label} class="field-row">
                            <span class="field-label">
                                {field.label}:
                                <template if:true={field.helpText}>
                                    <lightning-helptext content={field.helpText} class="slds-m-left_xx-small"></lightning-helptext>
                                </template>
                            </span>
                            <span class="field-value">{field.value}</span>
                        </div>
                    </template>
                </div>

                <!-- Divider after Column 2 (if Column 3 exists) -->
                <template if:true={column3Data}>
                    <div class="vertical-divider"></div>
                </template>
            </template>

            <template if:true={column3Data}>
                <div class="slds-col">
                    <template for:each={column3Data} for:item="field">
                        <div key={field.label} class="field-row">
                            <span class="field-label">
                                {field.label}:
                                <template if:true={field.helpText}>
                                    <lightning-helptext content={field.helpText} class="slds-m-left_xx-small"></lightning-helptext>
                                </template>
                            </span>
                            <span class="field-value">{field.value}</span>
                        </div>
                    </template>
                </div>
            </template>
        </div>
        
        <!-- Button to update out-of-date custom metadata labels -->
        <template if:true={showResetButton}>
            <div class="slds-align_absolute-center slds-m-top_medium">
                <lightning-button label="Reset to Default!" onclick={handleUpdateLabels} variant="brand"></lightning-button>
            </div>
        </template>
    </div>
</template>
