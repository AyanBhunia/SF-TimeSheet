<template>
    <div class="detail">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <template lwc:if={isWorking}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>

        <template lwc:if={error}>
            <div class="slds-text-color_error slds-p-around_small" role="alert">{error}</div>
        </template>

        <template lwc:if={hasRequest}>
            <div class="detail-header">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <span class="request-name slds-m-right_small">{request.name}</span>
                        <span class={statusBadgeClass}>{request.displayStatus}</span>
                    </div>
                    <div lwc:if={isApproveMode} class="slds-m-bottom_xx-small">
                        <lightning-button label="Approve" variant="brand" onclick={handleApprove}
                            disabled={isWorking} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Reject" variant="destructive" onclick={handleReject}
                            disabled={isWorking}></lightning-button>
                    </div>
                    <div lwc:if={showRetry} class="slds-m-bottom_xx-small">
                        <lightning-button label="Retry timesheet sync" icon-name="utility:refresh" onclick={handleRetry}
                            disabled={isWorking}></lightning-button>
                    </div>
                </div>
                <p class="slds-text-body_regular">{summaryLine}</p>
            </div>

            <div class="detail-body">
                <dl class="detail-facts">
                    <dt>Approver</dt>
                    <dd class={approverClass}>{approverText}</dd>
                    <dt>Reason</dt>
                    <dd>{reasonText}</dd>
                    <template lwc:if={hasDecision}>
                        <dt>Decision</dt>
                        <dd>{request.decisionNotes}</dd>
                    </template>
                    <dt>Submitted</dt>
                    <dd>{request.submittedOn}</dd>
                </dl>

                <c-pto-table columns={lineColumns} rows={lineRows} empty-message="This request has no days."></c-pto-table>

                <p lwc:if={isRejected} class="detail-note slds-m-top_small">
                    Rejected requests stay here as history. Apply again to create a new request for these dates.
                </p>
            </div>
        </template>

        <template lwc:if={showEmpty}>
            <div class="detail-empty">Select a request to see its days.</div>
        </template>
    </div>
</template>
