<template>
    <div class="slds-box slds-theme_default">
        <lightning-card title={timesheetCardTitle}>
            <div class="slds-p-around_medium">

                <div class="slds-grid slds-gutters slds-m-bottom_small">
                    <div class="slds-col slds-p-top_x-small">
                        <lightning-combobox data-id="prevTimesheet" name="Previous Timesheets" variant="label-hidden" options={prevTimesheets} onchange={prevTimesheet} placeholder="Select a previous Timesheet to copy" disabled={isLocked}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-p-top_x-small">
                        <lightning-button label="Copy" onclick={handleCopy} disabled={isLocked}></lightning-button>
                    </div>
                    <div class="slds-col slds-text-align_right">
                        <lightning-button label="Refresh" onclick={handleCancel} variant="neutral" class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button label="Save" onclick={handleSave} variant="brand" class="slds-m-right_x-small" disabled={isLocked}>
                        </lightning-button>
                    </div>
                </div>

                <template if:true={isLocked}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                        <lightning-icon icon-name="utility:lock" size="x-small" class="slds-m-right_x-small" variant="warning"></lightning-icon>
                        <h2 class="slds-p-right_small">{lockedMessage}</h2>
                    </div>
                </template>

                <template if:true={timerChangedWhileEditing}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                        <h2 class="slds-p-right_small">The timer changed this timesheet. Reload to see its changes; reloading discards your unsaved edits.</h2>
                        <lightning-button label="Reload" onclick={reloadGrid}></lightning-button>
                    </div>
                </template>

                <template if:true={isMultiWeek}>
                    <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_small week-nav-container">
                        <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-p-vertical_xx-small">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <template if:true={canGoPrev}>
                                        <lightning-button-icon icon-name="utility:chevronleft" variant="border-filled" alternative-text="Previous Week" onclick={handlePrevWeek} class="slds-m-right_xx-small">
                                        </lightning-button-icon>
                                    </template>
                                    <lightning-button-group class="slds-m-right_x-small">
                                        <template for:each={weekOptions} for:item="opt">
                                            <lightning-button key={opt.key} label={opt.label} variant={opt.variant} data-index={opt.index} onclick={handleSelectWeek}>
                                            </lightning-button>
                                        </template>
                                        <lightning-button label={allDaysLabel} variant={allDaysVariant} onclick={handleSelectAllDays}>
                                        </lightning-button>
                                    </lightning-button-group>
                                    <template if:true={canGoNext}>
                                        <lightning-button-icon icon-name="utility:chevronright" variant="border-filled" alternative-text="Next Week" onclick={handleNextWeek}>
                                        </lightning-button-icon>
                                    </template>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-text-align_right slds-p-vertical_xx-small">
                                <span class="slds-badge slds-theme_default slds-m-right_xx-small" title="Hours entered in the currently selected week">
                                    Active Week: <strong>{activeWeekHours}h</strong>
                                </span>
                                <span class="slds-badge slds-badge_inverse" title="Total hours entered across the entire timesheet cycle">
                                    Cycle Total: <strong>{overallTotalHours}h</strong>
                                </span>
                            </div>
                        </div>
                    </div>
                </template>

                <div class="table-scroll-container">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th class="slds-text-title_caps">Activity Name</th>
                                <template for:each={displayedDayHeaders} for:item="header">
                                    <th key={header.key} class="slds-text-title_caps slds-text-align_center">
                                        <div>{header.name}</div>
                                        <div class="header-date">{header.formattedDate}</div>
                                    </th>
                                </template>
                                <th class="slds-text-title_caps">Action</th>
                            </tr>
                        </thead>
                        <tbody>

                            <!-- Section Header for Billable Amounts -->
                            <tr class="slds-theme_shade duration_hours">
                                <td class="slds-text-title_bold">Billable Amount</td>
                                <template for:each={billableAmountsDisplay} for:item="total">
                                    <td key={total.key} class="slds-text-title_bold">{total.val}</td>
                                </template>
                                <td></td>
                            </tr>

                            <!-- Section Header for Totals -->
                            <tr class="slds-theme_shade duration_hours">
                                <td class="slds-text-title_bold">Total Hours</td>
                                <template for:each={grandTotalsDisplay} for:item="total">
                                    <td key={total.key} class="slds-text-title_bold">{total.val}</td>
                                </template>
                                <td></td>
                            </tr>

                            <!-- Section Header for Projects -->
                            <tr  class="duration_hours">
                                <td class="slds-text-title_bold slds-theme_shade slds-p-around_x-small">Projects Hours</td>
                                <template for:each={projectsTotalsDisplay} for:item="total">
                                    <td key={total.key} class="slds-text-title_bold slds-theme_shade slds-p-around_x-small">{total.val}</td>
                                </template>
                                <td class="slds-theme_shade"></td>
                            </tr>

                            <template for:each={displayedProjectsList} for:item="row">
                                <tr key={row.rowKey} class="slds-hint-parent">
                                    <td>
                                        <lightning-combobox name="projectName" variant="label-hidden" value={row.projectName}
                                            options={projectOptions} data-row-index={row.realIndex}
                                            onchange={handleProjectChange} placeholder="Select a Project"
                                            disabled={row.isProjectComboboxDisabled}>
                                        </lightning-combobox>

                                        <lightning-combobox name="activityName" value={row.activityName}
                                            options={row.activityOptions} data-row-index={row.realIndex}
                                            onchange={handleProjectChange} placeholder="Select an Activity"
                                            disabled={row.isProjectComboboxDisabled}>
                                        </lightning-combobox>
                                    </td>

                                    <template for:each={row.displayedDates} for:item="day">
                                        <td key={day.date}>
                                            <div class="slds-grid slds-grid_vertical">
                                                <div class="slds-col">
                                                    <lightning-input type="number" title="Duration" value={day.dur}
                                                        step="0.01" min="0" max="24" data-for="project"
                                                        data-row-index={row.realIndex} data-day-index={day.dayIndex} onchange={handleDurationChange} onkeydown={handleKeyDown}
                                                        disabled={day.isDurationDisabled}>
                                                    </lightning-input>
                                                </div>
                                                <div class="slds-col">
                                                    <lightning-textarea title="Description" value={day.desc} disabled={day.isDescDisabled} data-for="project" data-row-index={row.realIndex} data-day-index={day.dayIndex} onchange={handleDescriptionChange}>
                                                </lightning-textarea>
                                                </div>
                                            </div>
                                        </td>
                                    </template>

                                    <td>
                                        <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" class="slds-m-left_xx-small"
                                            variant="border-filled" data-row-index={row.realIndex} data-type="project" onclick={handleDeleteRow}
                                            disabled={row.isDeleteDisabled}>
                                        </lightning-button-icon>
                                    </td>
                                </tr>
                            </template>

                            <!-- Section Header for Absence -->
                            <tr  class="duration_hours">
                                <td class="slds-text-title_bold slds-theme_shade slds-p-around_x-small">Absence Hours</td>
                                <template for:each={absenceTotalsDisplay} for:item="total">
                                    <td key={total.key} class="slds-text-title_bold slds-theme_shade slds-p-around_x-small">{total.val}</td>
                                </template>
                                <td class="slds-theme_shade"></td>
                            </tr>

                            <template for:each={displayedAbsenceList} for:item="row">
                                <tr key={row.rowKey} class="slds-hint-parent">
                                    <td>
                                        <lightning-combobox name="absenceName" variant="label-hidden" value={row.absenceName} 
                                            options={absenceOptions} disabled={row.isAbsenceComboboxDisabled}
                                            data-row-index={row.realIndex} onchange={handleAbsenceChange} placeholder="Select an Absence Catagory">
                                        </lightning-combobox>
                                    </td>
                            
                                    <template for:each={row.displayedDates} for:item="day">
                                        <td key={day.date}>
                                            <div class="slds-grid slds-grid_vertical">
                                                <div class="slds-col">
                                                    <lightning-input type="number" title="Duration" value={day.dur} step="0.01" min="0" max="24" data-for="absence" disabled={day.isDurationDisabled}
                                                        data-row-index={row.realIndex} data-day-index={day.dayIndex} onchange={handleDurationChange} onkeydown={handleKeyDown}>
                                                    </lightning-input>
                                                </div>
                                                <div class="slds-col">
                                                    <lightning-textarea title="Description" value={day.desc} disabled={day.isDescDisabled} data-for="absence" data-row-index={row.realIndex} data-day-index={day.dayIndex} onchange={handleDescriptionChange}>
                                                    </lightning-textarea>
                                                </div>
                                            </div>
                                        </td>
                                    </template>

                                    <td>
                                        <template lwc:if={row.hasPto}>
                                            <lightning-icon icon-name="utility:lock" size="x-small" title="This leave was approved in the PTO tab and cannot be deleted here" class="slds-m-left_xx-small">
                                            </lightning-icon>
                                        </template>
                                        <template lwc:else>
                                            <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" class="slds-m-left_xx-small"
                                                variant="border-filled" data-row-index={row.realIndex} data-type="absence" onclick={handleDeleteRow}
                                                disabled={row.isDeleteDisabled}>
                                            </lightning-button-icon>
                                        </template>
                                    </td>
                                </tr>
                            </template>

                        </tbody>
                    </table>
                </div>

                <div class="slds-grid slds-grid_align-spread slds-p-top_medium">
                    <!-- Left group -->
                    <div class="slds-col">
                        <lightning-button label="Add Project" onclick={handleAddProject} variant="neutral" class="slds-m-right_x-small" disabled={isLocked}>
                        </lightning-button>
                        <lightning-button label="Add Absence" onclick={handleAddAbsence} variant="neutral" class="slds-m-right_x-small" disabled={isLocked}>
                        </lightning-button>
                    </div>
                
                    <!-- Right group -->
                    <div class="slds-col slds-text-align_right">
                        <lightning-button label="Refresh" onclick={handleCancel} variant="neutral" class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button label="Save" onclick={handleSave} variant="brand" class="slds-m-right_x-small" disabled={isLocked}>
                        </lightning-button>
                    </div>
                </div>
            </div>
        </lightning-card>
    </div>
</template>
